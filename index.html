<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/rentset/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RentSet — Turnover management for landlords</title>
    <meta
      name="description"
      content="RentSet helps landlords and property managers run every rental turnover — inspections, repairs, cleaning, vendors, and listing — from one place, from notice to move-in."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script type="text/javascript">
      // Restores the real path after the 404.html redirect trick, so
      // GitHub Pages can serve this single-page app on any deep link.
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })(window.location)
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
