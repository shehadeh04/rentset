<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>RentSet</title>
    <script type="text/javascript">
      // GitHub Pages has no server-side routing, so a deep link (e.g.
      // /rentset/app/properties) 404s here. We encode the intended path
      // into a query string and redirect to index.html, which decodes it
      // back (see index.html) and hands off to the client-side router.
      var segmentCount = 1
      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + segmentCount)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(segmentCount)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
      )
    </script>
  </head>
  <body></body>
</html>
